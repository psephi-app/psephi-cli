[build-system]
# hatchling, not uv_build: Homebrew builds every resource from its sdist, and uv_build has no
# pure-Python sdist (it is Rust) — hatchling builds anywhere with just Python
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "psephi"
dynamic = ["version"]
description = "Command-line client for the Psephi personal finance API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Psephi" }]
keywords = ["psephi", "personal finance", "cli", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.27,<1",
    "keyring>=25",
]

[project.urls]
Homepage = "https://psephi.app/"
Documentation = "https://api.psephi.app/v1/docs/"
Source = "https://github.com/psephi-app/psephi-cli"

[project.scripts]
psephi = "psephi.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.22",
    "pyyaml>=6",
    "packaging>=24",  # packaging/homebrew/render_formula.py
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/psephi/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/psephi", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/psephi"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographic quotes and dashes in text are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["psephi"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
