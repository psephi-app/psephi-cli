  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Personal API token: `Authorization: Bearer psephi_pat_…`, created in the account settings (Account → API tokens) or with `POST /v1/tokens/`. Or an OAuth 2.1 access token `psephi_oat_…` — a program signing in through the browser (authorization code with PKCE, or device code); the authorization server is described at `/.well-known/oauth-authorization-server`.

        Token scopes (each operation lists the ones it needs in `x-required-scopes`; write on a resource also grants read on it):

        - `account:read` — read: Account settings: profile, language, API tokens. Write also creates and revokes tokens (no wider than its own scopes).
        - `account:write` — read and write: Account settings: profile, language, API tokens. Write also creates and revokes tokens (no wider than its own scopes).
        - `transactions:read` — read: Transactions: list, details, create, edit and delete, attachments.
        - `transactions:write` — read and write: Transactions: list, details, create, edit and delete, attachments.
        - `accounts:read` — read: Accounts and their settings: balances, groups, loan and deposit terms.
        - `accounts:write` — read and write: Accounts and their settings: balances, groups, loan and deposit terms.
        - `analytics:read` — read: Analytics: reports, summaries, budgets and plans — what is computed from transactions.
        - `analytics:write` — read and write: Analytics: reports, summaries, budgets and plans — what is computed from transactions.
        - `categorization:read` — read: Categorization: categories, rules and keywords, labelling transactions.
        - `categorization:write` — read and write: Categorization: categories, rules and keywords, labelling transactions.
      x-scopes:
        account:read: 'read: Account settings: profile, language, API tokens. Write
          also creates and revokes tokens (no wider than its own scopes).'
        account:write: 'read and write: Account settings: profile, language, API tokens.
          Write also creates and revokes tokens (no wider than its own scopes).'
        transactions:read: 'read: Transactions: list, details, create, edit and delete,
          attachments.'
        transactions:write: 'read and write: Transactions: list, details, create,
          edit and delete, attachments.'
        accounts:read: 'read: Accounts and their settings: balances, groups, loan
          and deposit terms.'
        accounts:write: 'read and write: Accounts and their settings: balances, groups,
          loan and deposit terms.'
        analytics:read: 'read: Analytics: reports, summaries, budgets and plans —
          what is computed from transactions.'
        analytics:write: 'read and write: Analytics: reports, summaries, budgets and
          plans — what is computed from transactions.'
        categorization:read: 'read: Categorization: categories, rules and keywords,
          labelling transactions.'
        categorization:write: 'read and write: Categorization: categories, rules and
          keywords, labelling transactions.'
