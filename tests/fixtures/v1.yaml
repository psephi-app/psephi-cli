components:
  schemas:
    AccountKindEnum:
      enum:
      - current
      - savings
      - deposit
      - credit_card
      - loan
      - mortgage
      - bnpl
      - brokerage
      - cash
      - paid_by_others
      type: string
      description: |-
        * `current` - Current
        * `savings` - Savings
        * `deposit` - Deposit
        * `credit_card` - Credit Card
        * `loan` - Loan
        * `mortgage` - Mortgage
