    | `password_wrong` | 400 | Wrong PDF password |
    | `sync_rejected` | 400 | Change rejected |
    | `keywords_rejected` | 400 | Keywords not imported |
    | `credential_revoked` | 409 | Application key revoked |
    | `sync_in_progress` | 409 | Already syncing |
    | `bank_error` | 400 | Bank refused |

    # Versioning and deprecation

    The version is the first segment of the path: `/v1/`. These rules are part of the API contract.

    ## What may change within v1

    Without notice, in the current version:

    - new endpoints, methods, optional request fields and query parameters;
    - new response fields, new optional headers, new error codes for new cases;
    - new values of enumerations **in responses** — a client must tolerate values it does not know;
    - accepting more than before (looser validation) and fixing responses that contradicted the schema;
    - the text of `title` and `detail` of errors.

    Do not rely on the order of fields, on the absence of new fields or on the text of errors.

    ## Breaking changes

    A breaking change is anything after which a correctly written client stops working. Such changes are made **only in a new major version** (`/v2/`):

    - removing or renaming an endpoint, method, response field or query parameter;
    - changing the type, format, units or meaning of a field (string ↔ number, date format, precision of amounts);
    - making an optional request field required, rejecting what used to be accepted;
    - a response field that was always present becoming absent or `null`;
    - removing an enumeration value; changing the error `code` or HTTP status for the same case;
    - changing pagination, the default order, authentication or the scopes an existing endpoint needs.

    Every change of the schema is checked for breaking changes before release.

    ## Versions and support

    - A new major version runs next to the old one: `/v1/` and `/v2/` work at the same time until the old one's sunset date.
    - An old version is supported for **at least 12 months** after its successor is released and it is announced as deprecated. A single deprecated endpoint also keeps working for at least 12 months after it is marked.

    ## Deprecation headers

    A deprecated endpoint keeps working as before and adds to every response, errors included:

    - `Deprecation: @<Unix seconds>` — since when it is deprecated (RFC 9745);
    - `Sunset: <HTTP date>` — after which it stops answering (RFC 8594);
    - `Link: <url>; rel="deprecation"` (and `rel="sunset"` when a sunset date is set) — where the replacement is described.

    ```
    Deprecation: @1796083200
    Sunset: Wed, 01 Dec 2027 00:00:00 GMT
    Link: <https://api.psephi.app/v1/policy/>; rel="deprecation", <https://api.psephi.app/v1/policy/>; rel="sunset"
    ```

    In the schema such an operation is marked `deprecated: true`.

    ## Deprecation process

    1. The replacement is ready and documented (a new version or a new endpoint).
    2. The old endpoint is marked deprecated with a sunset date at least 12 months ahead, and the change is announced in “What's new” in the app and in this documentation.
    3. Until the sunset date it works as before. After it, it answers `410 gone` for at least 3 more months and is then removed.

    Exception: a security vulnerability or a legal requirement may shorten these periods, up to immediate shutdown, announced at once.
paths:
  /.well-known/oauth-authorization-server:
    get:
      operationId: oauth_server_metadata
      description: 'RFC 8414: endpoints, grant types, PKCE S256, scopes.'
      summary: Authorization server metadata
      tags:
      - .well-known
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        default:
          description: Error (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /.well-known/oauth-protected-resource:
    get:
      operationId: oauth_resource_metadata
      description: 'RFC 9728: the `/v1` resource, its authorization server and scopes.
        The address is in `resource_metadata` of the `WWW-Authenticate` header of
        a 401 response.'
      summary: Protected resource metadata
      tags:
      - .well-known
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        default:
          description: Error (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /oauth/device_authorization:
    post:
      operationId: oauth_device_authorization
      description: 'RFC 8628: device_code is for the client to poll `/oauth/token`,
        user_code is for the person to enter on the verification_uri page. Valid for
        5 minutes.'
      summary: Device code
      tags:
      - oauth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthDeviceRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthDeviceResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
          description: ''
        default:
          description: Error (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /oauth/revoke:
    post:
      operationId: oauth_revoke
      description: 'RFC 7009: revoking an access or refresh token ends the whole connection.
        Answers 200 for an unknown or already revoked token too.'
      summary: Revoke OAuth token
      tags:
      - oauth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthRevokeRequestRequest'
        required: true
      responses:
        '200':
          description: Revoked, or there was no such token.
        default:
          description: Error (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /oauth/token:
    post:
      operationId: oauth_token
      description: Authorization code exchange with PKCE (S256), refresh with rotation
        (reusing an old refresh token revokes the connection) and device code polling
        (authorization_pending, slow_down, access_denied, expired_token). Errors follow
        RFC 6749, 5.2.
      summary: OAuth token
      tags:
      - oauth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
          description: ''
        default:
          description: Error (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/:
    get:
      operationId: v1_root
      description: Public API version and links to its schema, documentation, compatibility
        policy and error catalog. No token needed.
      summary: Version root
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Root'
              examples:
                Root:
                  value:
                    version: v1
                    links:
                      self: https://api.psephi.app/v1/
                      schema: https://api.psephi.app/v1/schema/
                      docs: https://api.psephi.app/v1/docs/
                      policy: https://api.psephi.app/v1/policy/
                      problems: https://api.psephi.app/v1/problems/
          description: ''
        default:
          description: Error (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/accounts/:
    get:
      operationId: v1_accounts_list
      description: Own accounts and subaccounts, archived ones included; cursor pagination.
        Scope `accounts:read`.
      summary: Accounts
      parameters:
      - name: cursor
        required: false
        in: query
        description: 'Page cursor: the value from `next` or `previous` of the previous
          response. No cursor means the first page. An invalid cursor answers 400
          `invalid_cursor`.'
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: 'Rows per page: 50 by default, at most 200 (a larger value is
          cut down to the limit).'
        schema:
          type: integer
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedV1AccountList'
              examples:
                Account:
                  value:
                    next: http://api.example.org/accounts/?cursor=cD00ODY%3D"
                    previous: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
                    results:
                    - id: 9e1d2c3b-4a5f-4e6d-8c7b-1a2b3c4d5e6f
                      name: mBank PLN
                      kind: current
                      currency: PLN
                      parent: null
                      archived: false
                      include_in_net_worth: true
                      created_at: '2026-01-03T10:00:00Z'
          description: ''
        default:
          description: Error (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-required-scopes:
      - accounts:read
  /v1/accounts/{id}/:
    get:
      operationId: v1_accounts_retrieve
      description: Account settings; someone else's or a missing one answers 404.
        Scope `accounts:read`.
      summary: Account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
        description: 'Resource identifier: the `id` field from a list or a detail
          response.'
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Account'
              examples:
                Account:
                  value:
                    id: 9e1d2c3b-4a5f-4e6d-8c7b-1a2b3c4d5e6f
                    name: mBank PLN
                    kind: current
                    currency: PLN
                    parent: null
                    archived: false
                    include_in_net_worth: true
                    created_at: '2026-01-03T10:00:00Z'
          description: ''
        default:
          description: Error (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-required-scopes:
      - accounts:read
    patch:
      operationId: v1_accounts_update
      description: Only `name`, `archived` and `include_in_net_worth`; other fields
        answer 400. Scope `accounts:write`.
      summary: Change name and visibility
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
        description: 'Resource identifier: the `id` field from a list or a detail
          response.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedV1AccountUpdateRequest'
            examples:
              Archive:
                value:
                  archived: true
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedV1AccountUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedV1AccountUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Account'
          description: ''
        default:
          description: Error (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-required-scopes:
      - accounts:write
  /v1/analytics/balances/:
    get:
      operationId: v1_analytics_balances
      description: Current balances of own accounts and subaccounts, each in its own
        currency; archived ones included, internal ones left out. Cursor pagination.
        Scope `analytics:read`.
      summary: Account balances
      parameters:
      - name: cursor
        required: false
        in: query
        description: 'Page cursor: the value from `next` or `previous` of the previous
          response. No cursor means the first page. An invalid cursor answers 400
          `invalid_cursor`.'
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: 'Rows per page: 50 by default, at most 200 (a larger value is
          cut down to the limit).'
        schema:
          type: integer
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedV1BalanceList'
              examples:
                Balance:
                  value:
                    next: http://api.example.org/accounts/?cursor=cD00ODY%3D"
                    previous: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
                    results:
                    - account: 9e1d2c3b-4a5f-4e6d-8c7b-1a2b3c4d5e6f
                      name: mBank PLN
                      balance:
                        amount: '1520.3000'
                        currency: PLN
                      booked_balance:
                        amount: '1562.8000'
                        currency: PLN
                      on_hold:
                        amount: '-42.5000'
                        currency: PLN
          description: ''
        default:
          description: Error (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-required-scopes:
      - analytics:read
  /v1/analytics/categories/:
    get:
      operationId: v1_analytics_categories
      description: 'Summary for a period: spending and income by category, in the
        currencies of the transactions. The period is `date_from` (required) to `date_to`
        (today by default), inclusive. Scope `analytics:read`.'
      summary: Spending and income by category
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Start of the period.
        required: true
      - in: query
        name: date_to
