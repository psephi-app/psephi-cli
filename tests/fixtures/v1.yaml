    | `token_revoked` | 401 | API token revoked |
    | `insufficient_scope` | 403 | Insufficient token scope |
    | `oauth_invalid_request` | 400 | Invalid authorization request |
    | `too_many_connections` | 409 | Too many connected apps |
    | `personal_token_required` | 403 | Personal token required |
    | `too_many_tokens` | 409 | Too many tokens |
