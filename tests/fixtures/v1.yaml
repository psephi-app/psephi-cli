    Problem:
      type: object
      description: |-
        API error, RFC 9457 (`application/problem+json`). Codes:

        - `bad_request` (400, Bad request): The request was not accepted; the server gave no more specific reason.
        - `validation_error` (400, Invalid input): The request data failed validation. Field errors are in `fields`, a general one in `detail`.
        - `parse_error` (400, Malformed request): The request body cannot be parsed: broken JSON, wrong file format, damaged spreadsheet.
        - `invalid_cursor` (400, Invalid page cursor): The page cursor (`cursor`) is invalid or damaged: take it only from `next` or `previous` of a list response; no cursor means the first page.
        - `not_authenticated` (401, Not signed in): Sign-in required: there is no session or it has expired. Header `WWW-Authenticate: Session`; on the public API host it is `Bearer`: the `Authorization: Bearer <token>` header is missing.
        - `authentication_failed` (401, Authentication failed): The request credentials were not accepted.
        - `permission_denied` (403, Access denied): Signed in, but this action is not allowed.
        - `csrf_failed` (403, CSRF check failed): The CSRF token is missing or stale: get a new one from `GET /api/auth/csrf/` and repeat the request.
        - `not_found` (404, Not found): No such address or object, or it belongs to someone else: other people's data answers with the same 404.
        - `method_not_allowed` (405, Method not allowed): This HTTP method is not supported at this address.
        - `not_acceptable` (406, Not acceptable): No response in the format from `Accept`: the API answers with JSON.
        - `conflict` (409, Conflict): The action conflicts with the current state of the data; what is in the way is in `detail`.
        - `gone` (410, Gone): The object no longer exists.
        - `payload_too_large` (413, Request too large): The request body is larger than allowed. A file too large for a form field is an error of that field (`validation_error`), not 413.
        - `unsupported_media_type` (415, Unsupported media type): The body is in the wrong format (`Content-Type`): the API accepts JSON, files as multipart.
        - `throttled` (429, Too many requests): Rate limit exceeded. How many seconds to wait before retrying is in `retry_after` and the `Retry-After` header.
        - `server_error` (500, Server error): Server failure. The response has no details; they are in the server log.
        - `not_implemented` (501, Not implemented): The feature is declared but not built yet (for example, an export format).
        - `bad_gateway` (502, Upstream service failed): An external service (bank, aggregator) answered with an error or did not answer.
        - `service_unavailable` (503, Service unavailable): The service is temporarily unavailable; retry later.
        - `pending_approval` (403, Sign-up awaiting approval): The sign-up is not approved yet: only sign-in and the own account (/api/auth/) are open.
        - `reauth` (403, Sign in again): The action needs a fresh sign-in (within the last 10 minutes): sign in again and repeat.
        - `wrong_credentials` (400, Wrong email or password): Password sign-in: the email or password does not match.
        - `wrong_code` (400, Wrong code): The code (from an email, an authenticator app or a backup code) does not match or has expired.
        - `invalid_code` (400, Invalid code or link): The code or link from the email is wrong or no longer valid; request new ones.
        - `login_expired` (400, Sign-in expired): The second sign-in step was not started or waited too long; start signing in again.
        - `key_rejected` (400, Passkey not accepted): The passkey (WebAuthn) was not accepted; try again.
        - `too_many_attempts` (429, Too many attempts): Too many wrong attempts at the second step; wait.
        - `last_second_factor` (409, Last second method): This is the last second sign-in method while one is required: add another one or turn the requirement off together with it.
        - `no_second_factor` (400, No second method): A second method cannot be required while there is none: add a passkey or an authenticator app.
        - `email_same` (400, Same address): Email change: this is already the current address.
        - `email_taken` (400, Address taken): Email change: the address belongs to another account.
        - `email_changed_recently` (409, Address changed recently): Email change: the address was changed recently; retry in a few days.
        - `email_change_waiting` (409, Address change already waiting): Email change: a change is already waiting; cancel it first.
        - `email_change_limit` (429, Too many address changes): Email change: too many requests in a day; retry tomorrow.
        - `email_sent_recently` (429, Email just sent): An email has just been sent; wait a minute before retrying.
        - `nothing_to_confirm` (404, Nothing to confirm): Nothing is waiting for confirmation (an email change, removal of a sign-in method).
        - `token_expired` (401, API token expired): The API token has expired: its date passed or its sliding lifetime ran out without use; create a new one. Header `WWW-Authenticate: Bearer error="invalid_token"`.
        - `token_revoked` (401, API token revoked): The API token was revoked; create a new one. Header `WWW-Authenticate: Bearer error="invalid_token"`.
        - `insufficient_scope` (403, Insufficient token scope): The token lacks a scope for this action; the missing ones are in `required_scopes` and in the `WWW-Authenticate: Bearer error="insufficient_scope"` header. A token created with a token is no wider than its scopes.
        - `oauth_invalid_request` (400, Invalid authorization request): The OAuth authorize request from the app was not accepted: the OAuth error code is in `error`; `redirect` is the app's return address carrying this error, or null when the address cannot be trusted (unknown client or unregistered redirect_uri), and then only show the error.
        - `too_many_connections` (409, Too many connected apps): The person already has the maximum of connected (OAuth) apps (50); disconnect unused ones in Account > Connected apps.
        - `personal_token_required` (403, Personal token required): An API token can only be created in the web app or with a personal token: an app connected through OAuth cannot create itself a permanent token that would survive revoking the connection.
        - `too_many_tokens` (409, Too many tokens): Too many active API tokens; revoke unused ones.
        - `in_use` (409, In use): The object cannot be deleted: other data refers to it (what exactly is in `detail`).
        - `duplicate` (409, Already exists): This already exists. For an attachment, the earlier one is in `transaction` and `attachment`.
        - `deleted` (410, Deleted): Sync: the record was deleted on the server.
        - `resync` (410, Download everything again): Sync: the cursor is stale; download all data again, without a cursor.
        - `import_in_progress` (409, Import in progress): This file is already being imported; retry in a minute.
        - `not_recognized` (400, File not recognized): Import: the file format was not recognized. The error is in `fields.file`; a matching shared preset of the same format for the editor is in `preset_suggestion` (or null).
        - `password_required` (400, PDF password required): The PDF is password-protected: pass the password in `password`.
        - `password_wrong` (400, Wrong PDF password): The password does not open this PDF.
        - `sync_rejected` (400, Change rejected): Sync: the conflict resolution was not accepted. The operation result is in `result`.
        - `keywords_rejected` (400, Keywords not imported): Keyword import: the list has errors and nothing was saved. Per-row results are in `result`.
        - `credential_revoked` (409, Application key revoked): The aggregator application key was revoked; replace it.
        - `sync_in_progress` (409, Already syncing): The bank is already syncing; wait for it to finish.
        - `bank_error` (400, Bank refused): The bank aggregator refused (key, consent, data); a readable reason is in `detail`.
