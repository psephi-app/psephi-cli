# Snapshot of the public Psephi API schema (GET /v1/schema/), taken 2026-11-15.
# Refresh: download it again and update the date; tests/test_contract.py checks every call against it.
openapi: 3.0.3
info:
  title: Psephi public API
  version: v1
  description: |-
    The Psephi public API gives your own scripts and programs access to your personal finances in Psephi: profile, transactions, accounts and balances, categories and analytics.

    - Base URL: `https://api.psephi.app/v1/`. Requests and responses are JSON in UTF-8; dates are ISO 8601, money is a decimal string with its currency (`{"amount": "42.5000", "currency": "PLN"}`) — never parse it into a float.
    - This page is generated from the OpenAPI schema: [`/v1/schema/`](/v1/schema/) (YAML, `?format=json` for JSON). The version root [`/v1/`](/v1/) links to the schema, this documentation, the compatibility policy and the error catalog.
    - You only ever see your own data: someone else's object answers `404`, exactly like a missing one.

    # Quick start

    ## 1. Get a token

    **Personal token** — for your scripts, dashboards and CI. In the Psephi app open **Account → API tokens**, name the token, tick the scopes it needs and choose how long it lives. The token (`psephi_pat_…`) is shown **once**: copy it and keep it like a password. Psephi stores only its hash; a lost token is revoked and replaced, not recovered. You can also list, create and revoke tokens through the API (`/v1/tokens/`, scope `account`).

    **Sign-in through the browser (OAuth 2.1)** — for programs that should not ask you to paste a token. The API host is an OAuth 2.1 authorization server, discovered from [`/.well-known/oauth-authorization-server`](/.well-known/oauth-authorization-server) (RFC 8414); a `401` from `/v1` points to [`/.well-known/oauth-protected-resource`](/.well-known/oauth-protected-resource) (RFC 9728) in `WWW-Authenticate`.

    - *Authorization code with PKCE* (S256 only, `state` required) and a loopback redirect `http://127.0.0.1:<port>/callback` — for programs on your computer. You approve the scopes on the consent page in the app; the program exchanges the code at `POST /oauth/token`.
    - *Device code* (RFC 8628) — for servers and SSH sessions without a browser: `POST /oauth/device_authorization` returns a code that you enter at `https://psephi.app/device`; the program polls `POST /oauth/token`.
    - Access tokens (`psephi_oat_…`) live one hour; refresh tokens (`psephi_ort_…`) are single-use and rotate on every refresh. Connected programs are listed in **Account → Connected apps**, where one click disconnects them.
    - OAuth clients are registered by Psephi; the first one is the `psephi` command-line tool (`client_id=psephi-cli`). Registration of third-party clients is not open yet.

    ## 2. Make the first request

    ```bash
    export PSEPHI_TOKEN=psephi_pat_…

    curl -s https://api.psephi.app/v1/me/ \
      -H "Authorization: Bearer $PSEPHI_TOKEN"
    ```

    ```json
    {"id": "0b0f8d1e-2c55-4c43-9a3e-1f0c2b6b7a10", "email": "anna@example.com", "display_name": "Anna", "locale": "en", "base_currency": "EUR"}
    ```

    `GET /v1/token/` tells which token made the request, its scopes and expiry — handy for checking a token. Then list recent transactions (scope `transactions:read`):

    ```bash
    curl -s "https://api.psephi.app/v1/transactions/?page_size=20" \
      -H "Authorization: Bearer $PSEPHI_TOKEN"
    ```

    ## 3. Handle errors, pages and limits

    Read on: every error is `application/problem+json` with a stable `code` ([Errors](#section/Errors)), lists are paged with a cursor ([Pagination](#section/Pagination)), and each token has a request budget ([Rate limits](#section/Rate-limits)).

    # Authentication and scopes

    Every `/v1` request except the version root, the schema, this documentation and the error catalog carries `Authorization: Bearer <token>` — a personal token or an OAuth access token; both have the same scopes. There are no cookies and no CSRF on this host.

    A scope is `<resource>:<access>`, access being `read` or `write`; write on a resource also grants read on it. Each operation lists the scopes it needs in `x-required-scopes` (an empty list means any valid token). Give every program its own token with only the scopes it needs.

    | Scope | Grants |
    |---|---|
    | `account:read` | read: Account settings: profile, language, API tokens. Write also creates and revokes tokens (no wider than its own scopes). |
    | `account:write` | read and write: Account settings: profile, language, API tokens. Write also creates and revokes tokens (no wider than its own scopes). |
    | `transactions:read` | read: Transactions: list, details, create, edit and delete, attachments. |
    | `transactions:write` | read and write: Transactions: list, details, create, edit and delete, attachments. |
    | `accounts:read` | read: Accounts and their settings: balances, groups, loan and deposit terms. |
    | `accounts:write` | read and write: Accounts and their settings: balances, groups, loan and deposit terms. |
    | `analytics:read` | read: Analytics: reports, summaries, budgets and plans — what is computed from transactions. |
    | `analytics:write` | read and write: Analytics: reports, summaries, budgets and plans — what is computed from transactions. |
    | `categorization:read` | read: Categorization: categories, rules and keywords, labelling transactions. |
    | `categorization:write` | read and write: Categorization: categories, rules and keywords, labelling transactions. |

    - No `Authorization` header — `401 not_authenticated`; an unknown token — `401 authentication_failed`; an expired or revoked one — `401 token_expired` / `token_revoked`. All of them carry `WWW-Authenticate: Bearer …`.
    - A token without the needed scope — `403 insufficient_scope`; the scopes the operation needs are in `required_scopes`.

    # Pagination

    Every list in `/v1` is paged the same way, with a cursor.

    ```json
    {"next": "https://api.psephi.app/v1/transactions/?cursor=cD0yMDI2…", "previous": null, "results": [ … ]}
    ```

    - `next` and `previous` are full URLs of the neighbouring pages, `null` at the edge. Follow `next` until it is `null`. There is no total count.
    - `page_size` — rows per page: 50 by default, at most 200 (more is cut to 200).
    - Rows come newest first by a unique, immutable key, so a row added between requests does not shift the pages: nothing repeats and nothing is lost. Lists in `/v1` have no `?ordering=`.
    - The cursor is opaque: take it from `next`/`previous`, never build or parse it. A broken cursor is `400 invalid_cursor`.

    # Rate limits

    Each token may make 120 requests per fixed 60-second window (the defaults; separate tokens have separate budgets). Every response to a request with a token carries:

    | Header | Meaning |
    |---|---|
    | `RateLimit-Limit` | requests allowed in the window |
    | `RateLimit-Remaining` | requests left in the current window |
    | `RateLimit-Reset` | seconds until the window resets |
    | `RateLimit-Policy` | limit and window length, e.g. `120;w=60` |

    Beyond the limit the API answers `429` with code `throttled`, a `Retry-After` header and the same number in `retry_after`. Wait that many seconds before retrying; a program that needs more should get a token of its own.

    # Call log

    Psephi keeps a log of calls made with your tokens for 90 days: time, token, method, path without the query string, status, duration, IP and headers — with `Authorization`, cookies and anything token-like removed before storing; bodies are not stored. Read it in **Account → API tokens** or with `GET /v1/api-calls/` (scope `account:read`).

    # Errors

    Errors follow RFC 9457, `Content-Type: application/problem+json`:

    ```json
    {
      "type": "https://psephi.app/problems/insufficient_scope",
      "title": "Insufficient token scope",
      "status": 403,
      "detail": "The API token lacks the scope for this action",
      "instance": "/v1/transactions/5b7c3c1a-6f2e-4c1b-8a5d-2f3e4d5c6b7a/",
      "code": "insufficient_scope",
      "required_scopes": ["transactions:write"]
    }
    ```

    - Branch on `code` — it is stable. `title` and `detail` are human text in the language of the request (`Accept-Language`) and may change at any time.
    - `type` identifies the code; it is not a page address.
    - Validation errors (`400 validation_error`) list field errors in `fields`: a dotted path → `[{"code", "message"}]`.
    - The OAuth endpoints (`/oauth/…`) answer errors in the OAuth format instead (RFC 6749, `{"error", "error_description"}`).

    The full catalog, with a description of each code, is also served as JSON without a token: [`GET /v1/problems/`](/v1/problems/); the `Problem` schema below lists the same descriptions. New codes may appear for new cases; a code never changes its meaning.

    | Code | Status | Title |
    |---|---|---|
    | `bad_request` | 400 | Bad request |
    | `validation_error` | 400 | Invalid input |
    | `parse_error` | 400 | Malformed request |
    | `invalid_cursor` | 400 | Invalid page cursor |
    | `not_authenticated` | 401 | Not signed in |
    | `authentication_failed` | 401 | Authentication failed |
    | `permission_denied` | 403 | Access denied |
    | `csrf_failed` | 403 | CSRF check failed |
    | `not_found` | 404 | Not found |
    | `method_not_allowed` | 405 | Method not allowed |
    | `not_acceptable` | 406 | Not acceptable |
    | `conflict` | 409 | Conflict |
    | `gone` | 410 | Gone |
    | `payload_too_large` | 413 | Request too large |
    | `unsupported_media_type` | 415 | Unsupported media type |
    | `throttled` | 429 | Too many requests |
    | `server_error` | 500 | Server error |
    | `not_implemented` | 501 | Not implemented |
    | `bad_gateway` | 502 | Upstream service failed |
    | `service_unavailable` | 503 | Service unavailable |
    | `pending_approval` | 403 | Sign-up awaiting approval |
    | `reauth` | 403 | Sign in again |
    | `wrong_credentials` | 400 | Wrong email or password |
    | `wrong_code` | 400 | Wrong code |
    | `invalid_code` | 400 | Invalid code or link |
    | `login_expired` | 400 | Sign-in expired |
    | `key_rejected` | 400 | Passkey not accepted |
    | `too_many_attempts` | 429 | Too many attempts |
    | `last_second_factor` | 409 | Last second method |
    | `no_second_factor` | 400 | No second method |
    | `email_same` | 400 | Same address |
    | `email_taken` | 400 | Address taken |
    | `email_changed_recently` | 409 | Address changed recently |
    | `email_change_waiting` | 409 | Address change already waiting |
